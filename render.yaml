services:
  # ─── PHP Web Service ───────────────────────────────────────────────
  - type: web
    name: vhudi
    runtime: docker
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: vhudi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vhudi-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: vhudi-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: vhudi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vhudi-db
          property: password
      - key: APP_NAME
        value: VHUDI
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health.php

  # ─── Cron Job: ping health endpoint every 5 minutes to prevent spin-down ───
  - type: cron
    name: vhudi-keepalive
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "*/5 * * * *"
    command: curl -f -s https://vhudi.onrender.com/health.php

  # ─── Managed MySQL Database ────────────────────────────────────────
databases:
  - name: vhudi-db
    databaseName: vhudi
    user: vhudi_user
    plan: starter
